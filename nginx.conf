server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Backend service, resolved by name on the compose network at request time
    # (Docker's embedded DNS) so container restarts / IP changes don't break it.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend "backend:8000";

    # Allow larger image uploads for OCR (base64 encoded images)
    client_max_body_size 10M;

    # WebSocket proxy for real-time STT
    location /ws/ {
        proxy_pass http://$backend;
        # The SPA is a trusted first-party client: this container attaches the
        # service token so the browser bundle never holds a secret.
        proxy_set_header Authorization "Bearer ${API_TOKEN}";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket-specific headers
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # WebSocket timeout settings
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Proxy API calls to the FastAPI backend (includes /ocr for image OCR)
    location ~ ^/(feedback|speech-to-text|translate|ocr|health) {
        proxy_pass http://$backend;
        # The SPA is a trusted first-party client: this container attaches the
        # service token so the browser bundle never holds a secret.
        proxy_set_header Authorization "Bearer ${API_TOKEN}";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    # SPA fallback — all other routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
