# Host Nginx site for the MoM prototype.
# Install: sudo cp deploy/mom.nginx.conf /etc/nginx/sites-available/mom
#          sudo ln -s /etc/nginx/sites-available/mom /etc/nginx/sites-enabled/mom
#          sudo nginx -t && sudo systemctl reload nginx
#          sudo certbot --nginx -d mom.monitoringandautomationsolution.site   # adds the 443 block
#
# The frontend container (which proxies /feedback, /speech-to-text, /ws/... to
# the backend container) listens on 127.0.0.1:8081 — see docker-compose.yml.

server {
    listen 80;
    listen [::]:80;
    server_name mom.monitoringandautomationsolution.site;

    # Base64 image uploads for OCR
    client_max_body_size 10M;

    # Live speech-to-text WebSocket: needs the Upgrade headers and a long read timeout
    location /ws/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120;
    }
}
